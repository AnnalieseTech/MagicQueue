<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏰 MagicQueue: Disney Park Crowd Predictor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 border border-slate-200">
    <h1 class="text-3xl font-bold text-center text-indigo-600 mb-2">🏰 MagicQueue</h1>
    <p class="text-center text-slate-500 mb-6">Predict daily Walt Disney World crowd level percentages</p>

    <form id="predictionForm" class="space-y-4">
      <!-- Park Name -->
      <div>
        <label class="block font-medium text-slate-700 mb-1">Theme Park</label>
        <select id="park_name" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="Magic Kingdom">Magic Kingdom</option>
          <option value="Epcot">Epcot</option>
          <option value="Hollywood Studios">Hollywood Studios</option>
          <option value="Animal Kingdom">Animal Kingdom</option>
        </select>
      </div>

      <!-- Grid for Numerical Inputs -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Month (1-12)</label>
          <input type="number" id="month" value="7" min="1" max="12" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Day of Week (0-6)</label>
          <input type="number" id="dow_number" value="5" min="0" max="6" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">Operating Minutes</label>
        <input type="number" id="operating_minutes" value="780" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        <p class="text-xs text-slate-400 mt-1">Total open minutes (e.g., 780 = 13 hours)</p>
      </div>

      <!-- Binary Features (Checkboxes) -->
      <div class="grid grid-cols-2 gap-2 text-sm pt-2">
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="is_weekend" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Is Weekend</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="has_early_entry" checked class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Early Entry</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="has_extended_evening" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Extended Evening</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="has_special_event" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Special Event</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="is_holiday" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Is Holiday</span>
        </label>
        <label class="flex items-center space-x-2">
          <input type="checkbox" id="is_rainy" class="rounded text-indigo-600 focus:ring-indigo-500">
          <span>Is Rainy</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200">
        🔮 Predict Crowd Level
      </button>
    </form>

    <!-- Prediction Output -->
    <div id="result" class="hidden mt-6 p-4 rounded-lg bg-indigo-50 border border-indigo-200 text-center">
      <p class="text-slate-600 text-sm font-medium">Predicted Crowd Level</p>
      <p id="predictionValue" class="text-4xl font-extrabold text-indigo-600 mt-1">--%</p>
    </div>
  </div>

  <script>
    document.getElementById('predictionForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      // Collect data matching your FastAPI ParkRequest schema
      const payload = {
        park_name: document.getElementById('park_name').value,
        month: parseInt(document.getElementById('month').value),
        dow_number: parseInt(document.getElementById('dow_number').value),
        is_weekend: document.getElementById('is_weekend').checked ? 1 : 0,
        operating_minutes: parseFloat(document.getElementById('operating_minutes').value),
        has_early_entry: document.getElementById('has_early_entry').checked ? 1 : 0,
        has_extended_evening: document.getElementById('has_extended_evening').checked ? 1 : 0,
        has_special_event: document.getElementById('has_special_event').checked ? 1 : 0,
        is_holiday: document.getElementById('is_holiday').checked ? 1 : 0,
        is_rainy: document.getElementById('is_rainy').checked ? 1 : 0
      };

      try {
        // Points to your local FastAPI backend (or hosted Render URL)
        const response = await fetch('https://disneyqueue.onrender.com/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('API Request Failed');
        
        const data = await response.json();
        
        // Display result
        const resultDiv = document.getElementById('result');
        const predictionValue = document.getElementById('predictionValue');
        
        predictionValue.textContent = (data.predicted_crowd_level_pct || data.prediction || data.crowd_level || data).toString() + '%';
        resultDiv.classList.remove('hidden');

      } catch (err) {
        alert('Could not connect to backend service. Make sure FastAPI is running on http://localhost:8000');
        console.error(err);

        // To the live Render URL:
        const response = await fetch('https://disneyqueue-api.onrender.com/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }
    });
  </script>

</body>
</html>
